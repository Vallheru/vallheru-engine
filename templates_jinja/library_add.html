{% extends "base.html" %}

{% block title %}Dodaj tekst{% endblock %}

{% block content %}
<h2>Dodaj tekst do biblioteki</h2>

<form method="post" action="/library/add">
  <p>
    <label for="title">Tytuł:</label><br/>
    <input type="text" name="title" id="title" maxlength="255" size="60" />
  </p>
  <p>
    <label for="text_type">Rodzaj:</label><br/>
    <select name="text_type" id="text_type">
      {% for opt in type_options %}
      <option value="{{ opt.code }}">{{ opt.label }}</option>
      {% endfor %}
    </select>
  </p>
  <p>
    <label for="body">Treść:</label><br/>
    <textarea name="body" id="bbcode-editor" rows="20" cols="60"></textarea>
  </p>
  <p>
    <input type="submit" value="Wyślij" />
    <a href="/library">Anuluj</a>
  </p>
</form>

<p>Tekst zostanie sprawdzony przez bibliotekarza przed publikacją.</p>
{% endblock %}
