{# Outpost battle — attack form and results. #}
{% extends "base.html" %}

{% block content %}
<h2>Atakuj Strażnicę</h2>

{% if messages %}
  {% for msg in messages %}
  <p>{{ msg }}</p>
  {% endfor %}
{% else %}
<form method="post" action="/outposts/battle/execute">
  <p>
    ID strażnicy: <input type="number" name="oid" min="1" />
    <br />lub ID gracza: <input type="number" name="pid" min="1" />
  </p>
  <p>
    Ilość ataków (1-3): <input type="number" name="amount" min="1" max="3" value="1" />
  </p>
  <input type="submit" value="Atakuj" />
</form>
{% endif %}

<p><a href="/outposts">Wróć do menu Strażnicy</a></p>
{% endblock %}
