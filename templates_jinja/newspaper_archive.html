{% extends "base.html" %}

{% block title %}Archiwum gazety{% endblock %}

{% block content %}
<h2>Archiwum gazety</h2>

{% if issue_ids %}
<ul>
  {% for id in issue_ids %}
  <li><a href="/newspaper/issue/{{ id }}">Wydanie {{ id }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>Brak archiwalnych wydań.</p>
{% endif %}

<p><a href="/newspaper">Powrót do gazety</a></p>
{% endblock %}
