# Polish localization catalog for Vallheru.
#
# Modules map to PHP language files under languages/pl/.
# Keys match the original PHP define() constant names.
# Strings are migrated as-is from the PHP source.
#
# Modules are loaded on-demand per route; not every module
# needs to be present here until its route is migrated.

