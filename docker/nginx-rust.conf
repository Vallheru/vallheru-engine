# Rust-primary Nginx configuration.
#
# Proxies all traffic to the Rust Axum server on port 3000.
# No PHP-FPM, no template caches, no writable directories.
#
# Usage: include this file from the main nginx server block, or
# replace the default.conf entirely.

upstream rust_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Health checks (bypass access log) ---
    location = /healthz {
        access_log off;
        proxy_pass http://rust_app;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://rust_app;
    }

    # --- Operational endpoints ---
    location = /buildinfo {
        proxy_pass http://rust_app;
    }

    location = /migration-status {
        proxy_pass http://rust_app;
    }

    # --- Static assets (served by Rust binary, cached by Nginx) ---
    location /static/ {
        proxy_pass http://rust_app;
        proxy_cache_valid 200 1d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- User-uploaded content (avatars, tribe images) ---
    # These are the only files served directly from disk, not the binary.
    location /avatars/ {
        alias /var/www/uploads/avatars/;
        expires 1h;
    }

    location /images/tribes/ {
        alias /var/www/uploads/tribes/;
        expires 1h;
    }

    # --- All application routes → Rust ---
    location / {
        proxy_pass http://rust_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Deny access to PHP files (safety measure) ---
    location ~ \.php$ {
        return 404;
    }

    # --- Deny access to hidden files ---
    location ~ /\. {
        deny all;
    }

    # --- Deny access to config files ---
    location ~* \.(toml|yaml|yml|env|sql|md)$ {
        deny all;
    }
}
