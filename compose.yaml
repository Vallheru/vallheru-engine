# Development environment for the Rust Vallheru engine.
# Provides PostgreSQL as the only required external dependency.
#
# Usage:
#   docker compose up -d
#   cargo run -- migrate
#   cargo run -- serve

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vallheru
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vallheru
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vallheru"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
